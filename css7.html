<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding,margin,border</title>
<style>
    body{
        background-color: black;
        color: white;
    }
    .neha{
        height: 100px;
        width: 100px;
        background-color: chartreuse;
        /*first padding is for top and bottom and second for left and right*/
        padding:10px 20px;
        /*top right bottom left ==> it goes anticlockwise....*/
        margin:10px,20px,30px,40px;
    }
</style>
<body>
    <h1>padding , margin & border</h1>
    <div class="neha"></div>
 </body>
</html>
